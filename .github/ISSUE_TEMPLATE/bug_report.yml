name: Informe de error
description: Algo no funciona como debería
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarte el tiempo de reportar un error.

        Antes de continuar, revisa los issues abiertos y cerrados: puede que ya esté reportado.

        **No publiques vulnerabilidades de seguridad aquí.** Sigue la política de [SECURITY.md](https://github.com/alberto2005-coder/.github/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Versión o commit
      description: Release, etiqueta o hash del commit donde ocurre el problema.
      placeholder: "v1.2.0 / 8f3c2a1"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: Qué debería haber ocurrido.
      placeholder: Esperaba que el botón descargara el PDF generado.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
      description: Qué ocurre en realidad. Incluye el mensaje de error completo si lo hay.
      placeholder: 'Al pulsar el botón aparece una página en blanco y la consola muestra: "TypeError: ...".'
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: Secuencia exacta que lleva al problema.
      placeholder: |
        1. Abrir la aplicación
        2. Rellenar el formulario con ...
        3. Pulsar en ...
        4. Ver el error
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Entorno
      description: Sistema operativo, navegador o runtime y versión.
      placeholder: "Windows 11, Chrome 131 / Python 3.12, Node 20.11"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Trazas, capturas o logs
      description: Pega aquí el texto del error o arrastra imágenes. Se formatea como código automáticamente.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Configuración especial, cambios locales, extensiones instaladas o cualquier detalle que pueda influir.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Comprobaciones
      options:
        - label: He comprobado que no existe ya un issue que describa este mismo problema.
          required: true
        - label: He leído la documentación del repositorio antes de abrir el issue.
          required: false
