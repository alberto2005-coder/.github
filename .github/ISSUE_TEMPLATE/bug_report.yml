name: Bug report / Informe de error
description: Something is not working as expected / Algo no funciona como debería
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. You can write in English or Spanish.
        Gracias por tomarte el tiempo de reportar un error. Puedes escribir en inglés o en español.

        Check open and closed issues first: it may already be reported.
        Antes de continuar, revisa los issues abiertos y cerrados: puede que ya esté reportado.

        **Do not report security vulnerabilities here.** Follow [SECURITY.md](https://github.com/alberto2005-coder/.github/blob/main/SECURITY.md).
        **No publiques vulnerabilidades de seguridad aquí.** Sigue la política de [SECURITY.md](https://github.com/alberto2005-coder/.github/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Version or commit / Versión o commit
      description: Release, tag or commit hash where the problem occurs. / Release, etiqueta o hash del commit donde ocurre el problema.
      placeholder: "v1.2.0 / 8f3c2a1"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour / Comportamiento esperado
      description: What should have happened. / Qué debería haber ocurrido.
      placeholder: I expected the button to download the generated PDF. / Esperaba que el botón descargara el PDF generado.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour / Comportamiento actual
      description: What happens instead. Include the full error message if there is one. / Qué ocurre en realidad. Incluye el mensaje de error completo si lo hay.
      placeholder: 'The page goes blank and the console shows: "TypeError: ..." / La página queda en blanco y la consola muestra: "TypeError: ..."'
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Pasos para reproducirlo
      description: Exact sequence that leads to the problem. / Secuencia exacta que lleva al problema.
      placeholder: |
        1. Open the app / Abrir la aplicación
        2. Fill in the form with ... / Rellenar el formulario con ...
        3. Click on ... / Pulsar en ...
        4. See the error / Ver el error
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment / Entorno
      description: Operating system, browser or runtime and version. / Sistema operativo, navegador o runtime y versión.
      placeholder: "Windows 11, Chrome 131 / Python 3.12, Node 20.11"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or stack traces / Trazas, capturas o logs
      description: Paste the error text or drag images here. It is formatted as code automatically. / Pega aquí el texto del error o arrastra imágenes. Se formatea como código automáticamente.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context / Contexto adicional
      description: Special configuration, local changes, installed extensions or anything else that may matter. / Configuración especial, cambios locales, extensiones instaladas o cualquier detalle que pueda influir.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks / Comprobaciones
      options:
        - label: I checked that no existing issue describes this same problem. / He comprobado que no existe ya un issue que describa este mismo problema.
          required: true
        - label: I read the repository documentation before opening this issue. / He leído la documentación del repositorio antes de abrir el issue.
          required: false
