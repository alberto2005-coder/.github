name: Feature request / Propuesta de mejora
description: An idea for a new feature or an improvement / Idea para una nueva función o una mejora
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. You can write in English or Spanish.
        Gracias por proponer una mejora. Puedes escribir en inglés o en español.

        Describe the problem before the solution: it helps to weigh alternatives. For large changes, discuss the idea in the issue before writing code.
        Describe el problema antes que la solución: ayuda a valorar alternativas. Para cambios grandes, comenta la idea en el issue antes de escribir código.

  - type: textarea
    id: problem
    attributes:
      label: Problem or need / Problema o necesidad
      description: What is missing, what feels awkward or which use case is not covered. / Qué falta, qué resulta incómodo o qué caso de uso no está cubierto.
      placeholder: With many tasks I cannot filter by priority, so I waste time searching. / Cuando tengo muchas tareas no puedo filtrarlas por prioridad y pierdo tiempo buscando.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / Solución propuesta
      description: How you imagine the feature. / Cómo imaginas la funcionalidad.
      placeholder: A priority filter above the task list. / Un filtro de prioridad encima de la lista de tareas.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / Alternativas consideradas
      description: Other options you evaluated and why you discarded them. / Otras opciones que hayas valorado y por qué las descartas.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope / Alcance
      description: How large the change looks to you. / Cómo de grande te parece el cambio.
      options:
        - Small change (UI, text, a tweak) / Cambio pequeño (interfaz, texto, un ajuste)
        - Medium change (one scoped new feature) / Cambio medio (una función nueva acotada)
        - Large change (several parts or a redesign) / Cambio grande (varias partes o rediseño)
        - Not sure / No lo sé
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context / Contexto adicional
      description: Screenshots, sketches, links or examples from other tools. / Capturas, bocetos, enlaces o ejemplos de otras herramientas.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks / Comprobaciones
      options:
        - label: I checked that no existing issue proposes the same thing. / He revisado que no exista ya una propuesta igual en los issues.
          required: true
        - label: The proposal fits the goal of the project. / La propuesta encaja con el objetivo del proyecto.
          required: false
